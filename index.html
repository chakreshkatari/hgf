<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A question for Sara</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container" id="questionScreen">
        <div>
            <h1 class="header_text">Sara! Please AA Jaana Bro PG Ko...Aa Jayegi Na?</h1>
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="showYesScreen()">Yes</button>
            <button class="btn" id="noButton" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div class="container" id="yesScreen" style="display: none;">
        <h1 class="header_text">Yeeyy ! Finally</h1>
        <audio id="yesAudio" src="audio.mp3" preload="auto"></audio>
    </div>

    <script>
        function showYesScreen() {
            document.getElementById("questionScreen").style.display = "none";
            document.getElementById("yesScreen").style.display = "block";

            // Record the response on the server; the timestamp is not shown in the page.
            fetch("/api/yes-click", { method: "POST" }).catch(error => {
                console.error("Could not record the Yes response:", error);
            });

            const yesAudio = document.getElementById("yesAudio");
            yesAudio.play().catch(error => {
                console.log("Audio error:", error);
            });
        }

        function moveButton() {
            const button = document.getElementById("noButton");
            const maxX = Math.max(0, window.innerWidth - button.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - button.offsetHeight);
            button.style.position = "fixed";
            button.style.left = `${Math.random() * maxX}px`;
            button.style.top = `${Math.random() * maxY}px`;
        }
    </script>
</body>

</html>
