<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yay!</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <div>
            <h1 class="header_text">Yeeyy ! Finally</h1>
        </div>
        <div class="gif_container">
            <img src="https://i.postimg.cc/wTDG30TB/yes.gif" alt="Cute animated illustration" />
        </div>
        <audio id="yesAudio" controls autoplay>
            <source src="audio.mp3" type="audio/mpeg" />
            Your browser does not support audio playback.
        </audio>
        <button class="btn" id="yesButton" onclick="nextPage()">
        Let's Fix a Date
      </button>
    </div>

    <script>
        const yesAudio = document.getElementById("yesAudio");
        yesAudio.play().catch(() => {
            // Some browsers block autoplay; keep the player available for a manual start.
        });

        function nextPage() {
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
